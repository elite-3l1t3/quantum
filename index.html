<!doctype html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>biof</title>
<meta name="theme-color" content="#14100a">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#e8a317;--m:#b09a74;--bg:#14100a;--c:rgba(33,26,16,.94);--l:#3a2d18;--i:#2b2113}
*{box-sizing:border-box;margin:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg) center/cover fixed;color:#f6ead2;font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 25% 20%,rgba(232,163,23,.22),transparent 70%),radial-gradient(35% 30% at 80% 75%,rgba(150,85,30,.28),transparent 70%);animation:drift 20s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}}
@keyframes pop{40%{transform:scale(1.25)}}
a{color:inherit;text-decoration:none}
nav{display:flex;gap:16px;align-items:center;padding:14px 18px;max-width:900px;margin:auto;flex-wrap:wrap}
nav b{font-size:26px;font-weight:800;margin-right:auto;letter-spacing:-.5px}
nav a{color:var(--m);transition:color .2s}nav a:hover{color:var(--a)}nav b a{color:#f6ead2}
.w{max-width:900px;margin:auto;padding:8px 14px 40px}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:24px;max-width:460px;margin:16px auto;text-align:center;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
h1,h2{font-weight:800;letter-spacing:-.5px}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--a);background:var(--i);display:inline-block;box-shadow:0 0 0 5px rgba(232,163,23,.14),0 10px 26px -8px var(--a)}
button,input,textarea{font:inherit;font-size:16px;color:inherit;background:var(--i);border:1px solid var(--l);border-radius:12px;padding:10px 14px;transition:border-color .2s,transform .15s,filter .2s}
button{cursor:pointer;background:var(--a);border:0;color:#1a1205;font-weight:700}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:active{transform:scale(.97)}
button.g{background:var(--i);border:1px solid var(--l);color:#f6ead2}
button.pop{animation:pop .35s}
input,textarea{width:100%;margin:4px 0 10px}
input:focus,textarea:focus{outline:0;border-color:var(--a)}
input[type=color]{height:44px;padding:3px}
label{color:var(--m);font-size:13px}
.lk{display:block;padding:13px;margin:9px 0;border-radius:14px;background:var(--i);border:1px solid var(--l);font-weight:700;transition:transform .2s,border-color .2s,background .2s;animation:rise .5s both}
.lk:hover{transform:translate3d(0,-2px,0);border-color:var(--a);background:#34281a}
.lk:nth-of-type(2){animation-delay:.07s}.lk:nth-of-type(3){animation-delay:.14s}.lk:nth-of-type(4){animation-delay:.21s}.lk:nth-of-type(n+5){animation-delay:.28s}
.bd{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(232,163,23,.16);color:#f3c15a;margin:2px}
.row{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--l);text-align:left}
.row .av{width:36px;height:36px;border-width:1px;box-shadow:none}
a.row{transition:background .2s;animation:rise .4s both}a.row:hover{background:rgba(232,163,23,.08)}
a.row:nth-child(n+3){animation-delay:.05s}a.row:nth-child(n+5){animation-delay:.1s}a.row:nth-child(n+8){animation-delay:.15s}
a.row:nth-child(2) b:first-child{color:#f3c15a}a.row:nth-child(3) b:first-child{color:#cfcfcf}a.row:nth-child(4) b:first-child{color:#c98a52}
.bad{color:#ff7a5c;text-align:center;padding:6px}
@media(max-width:520px){.card{padding:18px;border-radius:16px;margin:10px 2px}nav{gap:12px}}
@media(prefers-reduced-motion:reduce){*,:before{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://zyrpzoqdoorekspavocs.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5cnB6b3Fkb29yZWtzcGF2b2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODk4OTIsImV4cCI6MjEwODE2NTg5Mn0.ilCd_6g1W7G4S9N3iYXBRwjOEqgYInysBLcH6h233as';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
const cu=u=>/^https?:\/\/[^\s"'()\\]+$/i.test(u||'')?u:'';
const av=p=>cu(p.avatar_url)?`<img class="av" loading="lazy" alt="" src="${e(p.avatar_url)}">`:'<span class="av"></span>';
const bdg=p=>[...(p.role=='admin'?['Admin']:[]),...(p.bid<=100?['OG']:[]),...(p.views>=1000?['1K+ views']:[]),...(p.likes>=50?['50+ likes']:[]),...(p.badges||[])];
let me=null,user=null;
const login=()=>sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+'/'}});
const go=p=>{history.pushState(0,'',p);route()};
const ERR={taken:'Энэ нэр авсан байна',invalid:'2-20 тэмдэгт (a-z, 0-9, _)',cooldown:'7 хоногт 1 удаа солино',banned:'Эрх байхгүй'};

async function loadMe(){
 const{data:{session}}=await sb.auth.getSession();user=session?.user||null;me=null;
 if(!user)return;
 const q=()=>sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 me=(await q()).data;
 if(me&&!me.username&&localStorage.pending){const u=localStorage.pending;localStorage.removeItem('pending');await sb.rpc('claim_username',{u});me=(await q()).data}
}
const bar=()=>`<nav><b><a href="/" data-n>biof</a></b><a href="/leaderboard" data-n>Leaderboard</a>${me?`${me.role=='admin'?'<a href="/admin" data-n>Admin</a>':''}<a href="/settings" data-n>#${me.bid} ${e(me.username||'профайл')}</a>`:'<button onclick="login()">Discord-оор нэвтрэх</button>'}</nav>${me?.banned?'<div class="bad">Таны хаяг ban хийгдсэн байна.</div>':''}`;

async function route(){
 document.body.style.backgroundImage='';document.documentElement.style.setProperty('--a','#e8a317');document.title='biof';
 const p=decodeURIComponent(location.pathname.slice(1)).toLowerCase().replace(/\/$/,'');
 app.innerHTML=bar()+'<div class="w" id="v"></div>';const v=$('#v');
 try{ if(!p)home(v);else if(p=='leaderboard')board(v,'views');else if(p=='settings')settings(v);else if(p=='admin')admin(v);else await profile(v,p)}
 catch(x){v.innerHTML='<div class="card">Алдаа гарлаа: '+e(x.message)+'</div>'}
}

function home(v){
 v.innerHTML=`<div class="card"><h1 style="font-size:34px;word-break:break-all">biof.site/<span id="u">you</span></h1><p style="color:var(--m);margin:8px 0 14px">Өөрийн bio хуудсаа үүсгэ. Зөвхөн Discord-оор нэвтэрнэ.</p><input id="n" maxlength="20" placeholder="username" autocomplete="off"><p id="s" style="min-height:24px"></p><button id="b">${me?.username?'Хуудас руу':'Нэр авах'}</button></div>`;
 let t;const n=$('#n');
 n.oninput=()=>{n.value=n.value.toLowerCase().replace(/[^a-z0-9_]/g,'');$('#u').textContent=n.value||'you';clearTimeout(t);
  t=setTimeout(async()=>{if(!n.value)return $('#s').textContent='';const{data}=await sb.rpc('username_status',{u:n.value});$('#s').textContent=data=='available'?'✓ Боломжтой':ERR[data]||''},250)};
 $('#b').onclick=async()=>{
  if(me?.username)return go('/'+me.username);
  if(!n.value)return;
  if(!user){localStorage.pending=n.value;return login()}
  const{data}=await sb.rpc('claim_username',{u:n.value});
  if(data!='ok')return $('#s').textContent=ERR[data]||data;
  await loadMe();go('/'+n.value)};
}

async function profile(v,name){
 const{data:p}=await sb.from('profiles').select('*').eq('username',name).maybeSingle();
 if(!p)return v.innerHTML='<div class="card"><h2>Олдсонгүй</h2><p style="color:var(--m);margin:8px 0">Энэ нэр сул байж магадгүй.</p><a href="/" data-n><button>Нэрээ ав</button></a></div>';
 document.title=(p.display_name||p.username)+' · biof';
 if(/^#[0-9a-f]{6}$/i.test(p.accent))document.documentElement.style.setProperty('--a',p.accent);
 if(cu(p.bg_url))document.body.style.backgroundImage=`url(${p.bg_url})`;
 let liked=false;
 if(me){liked=!!(await sb.from('likes').select('user_id').eq('profile_id',p.id).maybeSingle()).data}
 v.innerHTML=`<div class="card">${av(p)}<h2 style="margin-top:8px">${e(p.display_name||p.username)}</h2><div style="color:var(--m)">@${e(p.username)} · #${p.bid}</div><div>${bdg(p).map(b=>`<span class="bd">${e(b)}</span>`).join('')}</div><p style="margin:10px 0;white-space:pre-line">${e(p.bio)}</p>${(p.links||[]).slice(0,12).map(l=>`<a class="lk" target="_blank" rel="noopener nofollow" href="${e(safe(l.url))}">${e(l.label)}</a>`).join('')}<div style="margin-top:14px;display:flex;gap:12px;justify-content:center;align-items:center"><span>👁 ${p.views}</span><button id="lk" class="${liked?'':'g'}">♥ <span id="lc">${p.likes}</span></button></div></div>`;
 let lc=+p.likes;
 $('#lk').onclick=async()=>{
  if(!user)return login();
  const{data}=await sb.rpc('toggle_like',{pid:p.id});if(data==null)return;
  lc+=data?1:-1;$('#lc').textContent=lc;$('#lk').className=(data?'':'g')+' pop'};
 if(!me||me.id!=p.id){const vid=localStorage.vid||(localStorage.vid=crypto.randomUUID());sb.rpc('add_view',{pid:p.id,v:vid})}
}

async function board(v,by){
 const{data}=await sb.from('profiles').select('bid,username,display_name,avatar_url,views,likes').not('username','is',null).order(by,{ascending:false}).limit(50);
 v.innerHTML=`<div class="card" style="max-width:600px"><div style="display:flex;gap:8px;margin-bottom:8px"><button id="bv" class="${by=='views'?'':'g'}">Views</button><button id="bl" class="${by=='likes'?'':'g'}">Likes</button></div>${(data||[]).map((p,i)=>`<a class="row" href="/${e(p.username)}" data-n><b style="width:26px">${i+1}</b>${av(p)}<span style="flex:1">${e(p.display_name||p.username)} <small style="color:var(--m)">#${p.bid}</small></span><b>${p[by]}</b></a>`).join('')}</div>`;
 $('#bv').onclick=()=>board(v,'views');$('#bl').onclick=()=>board(v,'likes');
}

function settings(v){
 if(!me)return v.innerHTML='<div class="card"><button onclick="login()">Discord-оор нэвтрэх</button></div>';
 const L=(me.links||[]).map(l=>`${l.label} | ${l.url}`).join('\n');
 v.innerHTML=`<div class="card" style="text-align:left;max-width:520px"><h2>#${me.bid} Тохиргоо</h2><br>
 <label>Username (7 хоногт 1 удаа солино)</label><input id="un" maxlength="20" value="${e(me.username||'')}">
 <label>Нэр</label><input id="dn" maxlength="40" value="${e(me.display_name)}">
 <label>Bio</label><textarea id="bi" rows="3" maxlength="200">${e(me.bio)}</textarea>
 <label>Avatar URL</label><input id="au" value="${e(me.avatar_url)}">
 <label>Background URL</label><input id="bg" value="${e(me.bg_url)}">
 <label>Accent өнгө</label><input id="ac" type="color" value="${e(me.accent||'#e8a317')}">
 <label>Линкүүд (мөр бүр: Нэр | https://url)</label><textarea id="ls" rows="5">${e(L)}</textarea>
 <p id="ms" style="min-height:22px"></p><button id="sv">Хадгалах</button> <button class="g" id="lo">Гарах</button></div>`;
 $('#lo').onclick=async()=>{await sb.auth.signOut();go('/')};
 $('#sv').onclick=async()=>{
  const un=$('#un').value.trim().toLowerCase();
  if(un&&un!=me.username){const{data}=await sb.rpc('claim_username',{u:un});if(data!='ok')return $('#ms').textContent=ERR[data]||data}
  const links=$('#ls').value.split('\n').map(x=>x.split('|').map(s=>s.trim())).filter(a=>a[0]&&/^https?:\/\//i.test(a[1]||'')).slice(0,12).map(a=>({label:a[0].slice(0,40),url:a[1]}));
  const{error}=await sb.from('profiles').update({display_name:$('#dn').value,bio:$('#bi').value,avatar_url:$('#au').value||null,bg_url:$('#bg').value||null,accent:$('#ac').value,links}).eq('id',me.id);
  if(error)return $('#ms').textContent=error.message;
  await loadMe();$('#ms').textContent='Хадгаллаа ✓';
 };
}

async function admin(v){
 if(me?.role!='admin')return v.innerHTML='<div class="card">Эрх байхгүй</div>';
 const{data}=await sb.from('profiles').select('bid,username,display_name,role,banned,badges,views,likes').order('bid').limit(500);
 v.innerHTML=`<div class="card" style="max-width:760px;text-align:left"><h2>Admin</h2><br><input id="q" placeholder="Хайх: username эсвэл #bid">
 <div style="display:flex;gap:6px;margin-bottom:10px"><input id="ru" style="margin:0" placeholder="username"><button id="rs">Taken</button><button class="g" id="rr">Available</button></div><div id="list"></div></div>`;
 const act=async(a,t,val)=>{const{data:d,error}=await sb.rpc('admin_act',{act:a,target:t,val:val??''});alert(error?error.message:(ERR[d]||d));admin(v)};
 const draw=()=>{const q=$('#q').value.toLowerCase().replace('#','');
  $('#list').innerHTML=data.filter(p=>!q||(p.username||'').includes(q)||String(p.bid)==q).map(p=>`<div class="row" style="flex-wrap:wrap"><b>#${p.bid}</b><span style="flex:1">${e(p.username||'—')} ${p.banned?'<span class="bad">BAN</span>':''} <small style="color:var(--m)">${p.views}👁 ${p.likes}♥</small></span>
  <button class="g" data-a="${p.banned?'unban':'ban'}" data-b="${p.bid}">${p.banned?'Unban':'Ban'}</button><button class="g" data-a="rename" data-b="${p.bid}">Нэр</button><button class="g" data-a="free" data-b="${p.bid}">Free</button><button class="g" data-a="badges" data-b="${p.bid}">Badge</button></div>`).join('')};
 draw();$('#q').oninput=draw;
 $('#list').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a,t=+b.dataset.b;
  if(a=='rename'){const x=prompt('Шинэ username');if(x)act(a,t,x)}
  else if(a=='badges'){const x=prompt('Badge-үүд таслалаар (жишээ: verified,staff)');if(x!==null)act(a,t,x)}
  else if(a=='ban'){const x=prompt('Шалтгаан');if(x!==null)act(a,t,x)}
  else act(a,t)};
 $('#rs').onclick=()=>$('#ru').value&&act('reserve',0,$('#ru').value);
 $('#rr').onclick=()=>$('#ru').value&&act('release',0,$('#ru').value);
}

document.addEventListener('click',ev=>{const a=ev.target.closest('a[data-n]');if(a){ev.preventDefault();go(a.getAttribute('href'))}});
addEventListener('popstate',route);
sb.auth.onAuthStateChange((_,s)=>{if((s?.user?.id||null)!==(user?.id||null))setTimeout(async()=>{await loadMe();route()},0)});
loadMe().then(route);
</script></body></html>
